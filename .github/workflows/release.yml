# Publishes the package to NuGet when a version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Requires a NUGET_API_KEY secret in the repository settings.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack src/SiigoSharp/SiigoSharp.csproj --configuration Release --output artifacts -p:Version=${GITHUB_REF_NAME#v}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
